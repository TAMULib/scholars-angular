<scholars-copyright></scholars-copyright>
<div class="footer">
  <ul class="list-inline text-center" *ngIf="footer | async; let footer">
    <li class="list-inline-item" *ngFor="let link of footer.links">
      <a href="{{link.uri}}" [attr.aria-label]="link.label">{{link.label}}</a>
    </li>
    <li class="list-inline-item" *ngIf="(isAdmin | async) === true">
      <a [routerLink]="['/admin']" aria-label="Go to Admin Dashboard">{{ 'FOOTER.ADMINISTRATION' | translate }}</a>
    </li>
    <li class="list-inline-item" *ngIf="(isAuthenticated | async) === false">
      <a class="link" (click)="openRegistrationDialog()" aria-label="Open Registration Dialog">{{ 'FOOTER.REGISTRATION' | translate }}</a>
    </li>
    <li class="list-inline-item" *ngIf="(isAuthenticated | async) === false">
      <a class="link" (click)="openLoginDialog()" aria-label="Open Login Dialog">{{ 'FOOTER.LOGIN' | translate }}</a>
    </li>
    <li class="list-inline-item" *ngIf="(isAuthenticated | async) === true">
      <a class="link" (click)="logout()" aria-label="Logout from the application">{{ 'FOOTER.LOGOUT' | translate }}</a>
    </li>
    <li class="list-inline-item" *ngIf="user | async; let user">
      <span>{{user.email}}</span>
    </li>
  </ul>
</div>
