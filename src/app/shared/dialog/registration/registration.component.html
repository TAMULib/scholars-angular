<scholars-dialog [dialog]="dialog">
  <div [formGroup]="dialog.form" class="justify-self-center">
    <div class="form-group">
      <div class="input-group-lg">
        <input type="text" class="form-control" name="firstName" placeholder="{{ 'SHARED.DIALOG.REGISTRATION.FIRST_NAME' | translate }}" formControlName="firstName" [readonly]="isComplete()" [autofocus]="isSubmit()" [ngClass]="{'is-valid': isSubmit() && isValid('firstName'), 'is-invalid': isInvalid('firstName')}" aria-describedby="first-Name-Error" aria-required="true" />
        <div *ngIf="isInvalid('firstName')" id="first-Name-Error" class="invalid-feedback" role="alert">{{getErrorMessage('firstName') | async}}</div>
      </div>
    </div>
    <div class="form-group">
      <div class="input-group-lg">
        <input type="text" class="form-control" name="lastName" placeholder="{{ 'SHARED.DIALOG.REGISTRATION.LAST_NAME' | translate }}" formControlName="lastName" [readonly]="isComplete()" [ngClass]="{'is-valid': isSubmit() && isValid('lastName'), 'is-invalid': isInvalid('lastName')}" aria-describedby="last-name-error" aria-required="true" />
        <div *ngIf="isInvalid('lastName')" id="last-name-error" class="invalid-feedback" role="alert">{{getErrorMessage('lastName') | async}}</div>
      </div>
    </div>
    <div class="form-group">
      <div class="input-group-lg">
        <input type="text" class="form-control" name="email" placeholder="{{ 'SHARED.DIALOG.REGISTRATION.EMAIL' | translate }}" formControlName="email" autocomplete="username" [readonly]="isComplete()" [ngClass]="{'is-valid': isSubmit() && isValid('email'), 'is-invalid': isInvalid('email')}" aria-describedby="email-error" aria-required="true" />
        <div *ngIf="isInvalid('email')" id="email-error" class="invalid-feedback" role="alert">{{getErrorMessage('email') | async}}</div>
      </div>
    </div>
    <div class="form-group" [ngClass]="{'d-none': isSubmit()}">
      <div class="input-group-lg">
        <input type="password" class="form-control" name="password" placeholder="{{ 'SHARED.DIALOG.REGISTRATION.PASSWORD' | translate }}" formControlName="password" autocomplete="new-password" [ngClass]="{'is-valid': isValid('password'), 'is-invalid': isInvalid('password')}" aria-describedby="password-error" aria-required="true" />
        <div *ngIf="isInvalid('password')" id="password-error" class="invalid-feedback" role="alert">{{getErrorMessage('password') | async}}</div>
      </div>
    </div>
    <div class="form-group" [ngClass]="{'d-none': isSubmit()}">
      <div class="input-group-lg">
        <input type="password" class="form-control" name="confirm" placeholder="{{ 'SHARED.DIALOG.REGISTRATION.CONFIRM' | translate }}" formControlName="confirm" autocomplete="new-password" [ngClass]="{'is-valid': isValid('confirm'), 'is-invalid': isInvalid('confirm')}" aria-describedby="confirm-error" aria-required="true" />
        <div *ngIf="isInvalid('confirm')" id="confirm-error" class="invalid-feedback" role="alert">{{getErrorMessage('confirm') | async}}</div>
      </div>
    </div>
  </div>
</scholars-dialog>
