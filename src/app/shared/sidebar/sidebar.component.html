<div class="wrapper container">
  <nav class="sidebar {{menu.classes}}" *ngIf="menu | async; let menu" [ngClass]="{ 'd-none': (isSidebarCollapsed | async) }" role="navigation">

    <div class="card" *ngFor="let section of menu.sections; let sectionIndex = index">

      <div *ngIf="isBrowserRendered()" tabindex="0" class="card-header font-weight-bold {{section.classes}}" (click)="onSelectSection(section, sectionIndex)" (keyup.enter)="onSelectSection(section, sectionIndex)" role="button" [attr.aria-expanded]="!section.collapsed" [attr.aria-controls]="'section-' + sectionIndex">
        <span>{{section.title}}</span>
        <span *ngIf="section.collapsible" class="section-collapse float-right fa" [ngClass]="{ 'fa-caret-right': section.collapsed, 'fa-caret-down': !section.collapsed }" aria-hidden="true"></span>
      </div>

      <a *ngIf="isServerRendered()" tabindex="0" class="card-header font-weight-bold {{section.classes}}" [routerLink]="getRouterLink()" [queryParams]="getQueryParams(section, url | async)" role="link">
        <span>{{section.title}}</span>
        <span *ngIf="section.collapsible" class="section-collapse float-right fa" [ngClass]="{ 'fa-caret-right': section.collapsed, 'fa-caret-down': !section.collapsed }" aria-hidden="true"></span>
      </a>

      <div id="section-{{sectionIndex}}" class="card-item" [ngbCollapse]="section.collapsed">
        <ul class="list-group list-group-flush" *ngFor="let item of section.items">
          <li [ngSwitch]="item.type" class="list-group-item {{item.classes}}" [ngClass]="{'list-group-item-action link': item.type !== 'INFO'}" role="link">

            <span *ngSwitchCase="'FACET'" [ngSwitch]="item.facet.type">
              <span *ngSwitchCase="'STRING'" class="d-flex flex-nowrap justify-content-between">
                <a [routerLink]="item.route" [queryParams]="item.queryParams" role="link">
                  <span>
                    <span *ngIf="item.selected" class="fa fa-close mr-2" aria-hidden="true"></span>
                    <span>{{item.label | formalize}}</span>
                  </span>
                </a>
                <span class="badge badge-light" *ngIf="item.parenthetical">{{item.parenthetical}}</span>
              </span>

              <span *ngSwitchCase="'NUMBER_RANGE'" class="d-flex flex-nowrap justify-content-between">
                <a [routerLink]="item.route" [queryParams]="item.queryParams" role="link">
                  <span>
                    <span *ngIf="item.selected" class="fa fa-close mr-2" aria-hidden="true"></span>
                    <span>{{item.label}}</span>
                  </span>
                </a>
                <span class="badge badge-light" *ngIf="item.parenthetical">{{item.parenthetical}}</span>
              </span>

              <span *ngSwitchCase="'DATE_YEAR'" class="d-flex flex-nowrap justify-content-between">
                <a [routerLink]="item.route" [queryParams]="item.queryParams" role="link">
                  <span>
                    <span *ngIf="item.selected" class="fa fa-close mr-2" aria-hidden="true"></span>
                    <span>{{item.label | date:'yyyy':'UTC'}}</span>
                  </span>
                </a>
                <span class="badge badge-light" *ngIf="item.parenthetical">{{item.parenthetical}}</span>
              </span>
            </span>

            <span *ngSwitchCase="'ACTION'">
              <span tabindex="0" class="link" role="button" (click)="dispatchAction($event, item.action)" (keypress)="dispatchAction($event, item.action)">
                <span *ngIf="item.selected" class="fa fa-close mr-2" aria-hidden="true"></span>
                <span>{{item.label }}</span>
              </span>
            </span>

            <span *ngSwitchCase="'LINK'">
              <a [routerLink]="item.route" [queryParams]="item.queryParams" [queryParamsHandling]="'merge'" role="link">
                <span>
                  <span *ngIf="item.selected" class="fa fa-close mr-2" aria-hidden="true"></span>
                  <span>{{item.label | formalize}}</span>
                </span>
              </a>
            </span>

            <span *ngSwitchCase="'INFO'">
              <span>{{item.label }}</span>
            </span>

          </li>
        </ul>
      </div>
    </div>

  </nav>

  <div class="content container">
    <ng-content></ng-content>
  </div>
</div>
