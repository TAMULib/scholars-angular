<div *ngIf="page | async">
  <div *ngIf="getResources() | async as resources">
    <scholars-pagination *ngIf="resources.length > 0" [page]="page" [pageSizeOptions]="pageSizeOptions" [queryPrefix]="subsection.name" aria-labelledby="pagination-label">
      <div class="mb-3">
        <h5 id="pagination-label" class="font-weight-bold">{{subsection.name}}<span class="badge badge-light ml-2" role="status" aria-live="polite">{{resources.length}}</span></h5>
        <ul class="list-group" role="list" aria-labelledby="resource-list-label">
          <li class="list-group-item border-0" *ngFor="let resource of getResourcesPage(resources, subsection.sort, page | async)" role="listitem">
            <div [innerHtml]="subsection.templateFunction(resource) | safeHtml" role="presentation"></div>
          </li>
        </ul>
      </div>
    </scholars-pagination>
  </div>
</div>
